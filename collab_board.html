<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>协作看板 · Collab Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== Apple Dark Design Tokens ===== */
  :root {
    --bg: #000000;
    --bg-elev: #0c0c0e;
    --surface: #161618;
    --surface-2: #1c1c1f;
    --text: #f5f5f7;
    --dim: #a1a1a6;
    --dim-2: #6e6e73;
    --blue: #2997ff;
    --blue-dim: #1b6dff;
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --purple: #bf5af2;
    --line: rgba(255,255,255,.10);
    --line-soft: rgba(255,255,255,.06);
    --radius: 18px;
    --radius-sm: 12px;
    --radius-xs: 8px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter','Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    background: linear-gradient(180deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,0) 100%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-soft);
    padding: 14px 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    z-index: 10;
  }
  .topbar-left h1 {
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-left h1 .logo-mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--blue);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  .topbar-left .subtitle {
    font-size: 12px;
    color: var(--dim-2);
    margin-top: 3px;
    font-weight: 400;
  }
  .topbar-right { display: flex; align-items: center; gap: 18px; }
  .agent-pills { display: flex; gap: 6px; }
  .agent-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    font-size: 11px;
    color: var(--dim);
    font-weight: 500;
    transition: all 0.2s;
  }
  .agent-pill:hover { background: var(--surface-2); }
  .agent-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
  }
  .status-indicator {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px;
    color: var(--dim-2);
    font-weight: 500;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ===== 主体 ===== */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ===== 看板区域 ===== */
  .board-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--line-soft);
  }
  .board-header {
    padding: 16px 24px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .board-header h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .board-stats {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: var(--dim-2);
  }
  .board-stats span b {
    color: var(--text);
    font-weight: 600;
  }

  .board-columns {
    flex: 1;
    display: flex;
    gap: 14px;
    padding: 0 24px 20px;
    overflow-x: auto;
  }
  .board-col {
    flex: 1;
    min-width: 230px;
    display: flex;
    flex-direction: column;
    background: var(--bg-elev);
    border-radius: var(--radius);
    border: 1px solid var(--line-soft);
    overflow: hidden;
  }
  .col-header {
    padding: 14px 16px 10px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line-soft);
    letter-spacing: 0.3px;
  }
  .col-header .count {
    background: var(--surface-2);
    color: var(--dim);
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .col-todo .col-header { color: var(--dim); }
  .col-progress .col-header { color: var(--blue); }
  .col-done .col-header { color: var(--green); }
  .col-blocked .col-header { color: var(--red); }

  .col-body {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 任务卡片 — Apple 风格 */
  .task-card {
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .task-card:hover {
    background: var(--surface-2);
    border-color: var(--line);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .task-card.selected {
    border-color: var(--blue);
    box-shadow: 0 0 0 1px var(--blue), 0 4px 16px rgba(41,151,255,0.15);
  }
  .task-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .task-id {
    font-size: 10px;
    font-weight: 700;
    color: var(--blue);
    background: rgba(41,151,255,0.12);
    padding: 3px 7px;
    border-radius: 5px;
    letter-spacing: 0.5px;
  }
  .task-priority {
    font-size: 9px;
    padding: 3px 7px;
    border-radius: 5px;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .priority-high { background: rgba(255,69,58,0.12); color: var(--red); }
  .priority-medium { background: rgba(255,159,10,0.12); color: var(--orange); }
  .priority-low { background: rgba(142,142,147,0.12); color: var(--dim); }

  .task-title {
    font-size: 13px;
    color: var(--text);
    line-height: 1.45;
    margin-bottom: 10px;
    font-weight: 500;
  }
  .task-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .task-assignee {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--dim);
    font-weight: 500;
  }
  .task-assignee .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .task-depends {
    font-size: 10px;
    color: var(--dim-2);
  }
  .task-progress-bar {
    height: 3px;
    background: var(--line-soft);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .task-progress-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-todo { background: var(--dim-2); }
  .progress-progress { background: var(--blue); }
  .progress-done { background: var(--green); }
  .progress-blocked { background: var(--red); }

  .task-artifact {
    font-size: 10px;
    color: var(--dim);
    margin-top: 6px;
    word-break: break-all;
    line-height: 1.4;
  }
  .task-artifact::before { content: "📄 "; }

  /* 任务详情弹窗 — Apple 风格 */
  .task-detail {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px;
    width: 500px;
    max-height: 82vh;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: none;
  }
  .task-detail.show { display: block; animation: detailIn 0.3s cubic-bezier(0.4,0,0.2,1); }
  @keyframes detailIn {
    from { opacity: 0; transform: translate(-50%, -48%) scale(0.97); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .task-detail .close {
    position: absolute; top: 18px; right: 20px;
    color: var(--dim-2);
    cursor: pointer;
    font-size: 18px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    transition: all 0.2s;
  }
  .task-detail .close:hover { background: var(--surface); color: var(--text); }
  .task-detail h3 {
    font-size: 18px;
    color: var(--text);
    margin-bottom: 4px;
    font-weight: 600;
    letter-spacing: -0.3px;
    padding-right: 30px;
  }
  .task-detail .detail-id {
    font-size: 12px;
    color: var(--blue);
    margin-bottom: 20px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line-soft);
    font-size: 13px;
  }
  .detail-row:last-of-type { border-bottom: none; }
  .detail-label { color: var(--dim); }
  .detail-value {
    color: var(--text);
    text-align: right;
    max-width: 300px;
    font-weight: 500;
  }
  .detail-actions {
    margin-top: 22px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .detail-actions .actions-label {
    font-size: 11px;
    color: var(--dim-2);
    width: 100%;
    margin-bottom: 2px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .status-btn {
    padding: 7px 15px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    font-weight: 500;
  }
  .status-btn:hover { border-color: var(--blue); color: var(--blue); }
  .status-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    z-index: 99;
    display: none;
  }
  .overlay.show { display: block; }

  /* ===== 聊天区域 ===== */
  .chat-area {
    width: 380px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    background: var(--bg);
  }
  .chat-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .chat-header h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .chat-header .msg-count {
    font-size: 11px;
    color: var(--dim-2);
    font-weight: 500;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
  }
  .msg.system {
    align-self: center;
    max-width: 90%;
  }
  .msg.system .msg-content {
    background: var(--surface);
    color: var(--dim-2);
    font-size: 11px;
    text-align: center;
    padding: 6px 14px;
    border-radius: 12px;
    border: 1px solid var(--line-soft);
    font-weight: 500;
  }
  .msg.system .msg-sender { display: none; }
  .msg:not(.system) { align-self: flex-start; }
  .msg.self { align-self: flex-end; }
  .msg-sender {
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .msg-sender .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .msg-content {
    font-size: 13px;
    line-height: 1.6;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: var(--surface);
    border: 1px solid var(--line-soft);
    word-break: break-word;
    color: var(--text);
  }
  .msg.self .msg-content {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .msg-time {
    font-size: 10px;
    color: var(--dim-2);
    margin-top: 4px;
    font-weight: 500;
  }

  .chat-input-area {
    padding: 14px 18px 18px;
    border-top: 1px solid var(--line-soft);
    flex-shrink: 0;
  }
  .chat-identity {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .identity-btn {
    flex: 1;
    padding: 6px 8px;
    border-radius: var(--radius-xs);
    border: 1px solid var(--line-soft);
    background: transparent;
    color: var(--dim-2);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-weight: 500;
  }
  .identity-btn:hover { border-color: var(--line); color: var(--dim); }
  .identity-btn.active {
    border-color: var(--agent-color);
    color: var(--agent-color);
    background: rgba(255,255,255,0.03);
  }
  .identity-btn .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--agent-color);
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
  }
  .chat-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-xs);
    padding: 10px 14px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }
  .chat-input:focus {
    border-color: var(--blue);
    background: var(--surface-2);
  }
  .chat-input::placeholder { color: var(--dim-2); }
  .send-btn {
    padding: 10px 18px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: var(--radius-xs);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .send-btn:hover { background: var(--blue-dim); }
  .send-btn:active { transform: scale(0.97); }

  /* 滚动条 — Apple 风格 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div class="topbar-left">
    <h1>
      <span class="logo-mark">C</span>
      协作看板
    </h1>
    <div class="subtitle" id="project-subtitle">发动机交互式首页开发 · 多Agent协同</div>
  </div>
  <div class="topbar-right">
    <div class="agent-pills" id="agent-pills"></div>
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span id="status-text">实时同步</span>
    </div>
  </div>
</div>

<!-- 主体 -->
<div class="main">
  <!-- 看板 -->
  <div class="board-area">
    <div class="board-header">
      <h2>行动表 · Task Board</h2>
      <div class="board-stats" id="board-stats"></div>
    </div>
    <div class="board-columns" id="board-columns"></div>
  </div>

  <!-- 聊天 -->
  <div class="chat-area">
    <div class="chat-header">
      <h2>协作讨论</h2>
      <span class="msg-count" id="msg-count">0 条</span>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-area">
      <div class="chat-identity" id="chat-identity"></div>
      <div class="chat-input-row">
        <input type="text" class="chat-input" id="chat-input" placeholder="输入消息，Enter 发送..." />
        <button class="send-btn" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- 任务详情弹窗 -->
<div class="overlay" id="overlay" onclick="closeTaskDetail()"></div>
<div class="task-detail" id="task-detail">
  <span class="close" onclick="closeTaskDetail()">✕</span>
  <h3 id="detail-title">任务标题</h3>
  <div class="detail-id" id="detail-id">TASK-ID</div>
  <div id="detail-body"></div>
  <div class="detail-actions" id="detail-actions"></div>
</div>

<script>
// ===== 全局状态 =====
let boardData = null;
let currentIdentity = 'user';
let selectedTaskId = null;
let lastMessageCount = 0;
let autoScroll = true;

// Apple 系统色板 — Agent 配色
const AGENT_COLORS = {
  planner: '#2997ff',   // 蓝
  builder: '#30d158',   // 绿
  user: '#ff9f0a',      // 橙
};

const STATUS_CONFIG = {
  todo: { label: '待办', colClass: 'col-todo', progressClass: 'progress-todo' },
  in_progress: { label: '进行中', colClass: 'col-progress', progressClass: 'progress-progress' },
  done: { label: '已完成', colClass: 'col-done', progressClass: 'progress-done' },
  blocked: { label: '阻塞', colClass: 'col-blocked', progressClass: 'progress-blocked' }
};

// ===== 初始化 =====
async function init() {
  await loadBoard();
  renderAgentPills();
  renderIdentitySelector();
  setupEventListeners();
  setInterval(loadBoard, 2000);
}

// ===== 数据加载 =====
async function loadBoard() {
  try {
    const resp = await fetch('/api/board');
    boardData = await resp.json();
    renderBoard();
    renderChat();
    renderStats();
    document.getElementById('status-text').textContent = '实时同步';
  } catch (e) {
    document.getElementById('status-text').textContent = '连接断开，重试中...';
    console.error('加载看板失败:', e);
  }
}

// ===== 渲染：Agent 标签 =====
function renderAgentPills() {
  const container = document.getElementById('agent-pills');
  container.innerHTML = boardData.agents.map(a => {
    const color = AGENT_COLORS[a.id] || '#8e8e93';
    return `
      <div class="agent-pill">
        <div class="agent-dot" style="background:${color};"></div>
        <span>${a.name}</span>
      </div>
    `;
  }).join('');
}

// ===== 渲染：身份选择器 =====
function renderIdentitySelector() {
  const container = document.getElementById('chat-identity');
  container.innerHTML = boardData.agents.map(a => {
    const color = AGENT_COLORS[a.id] || '#8e8e93';
    return `
      <button class="identity-btn ${a.id === currentIdentity ? 'active' : ''}"
              style="--agent-color:${color};"
              onclick="setIdentity('${a.id}')">
        <div class="dot"></div>${a.name}
      </button>
    `;
  }).join('');
}

function setIdentity(id) {
  currentIdentity = id;
  renderIdentitySelector();
  renderChat(); // 重新渲染以更新 self 样式
}

// ===== 渲染：统计 =====
function renderStats() {
  const tasks = boardData.tasks;
  const total = tasks.length;
  const done = tasks.filter(t => t.status === 'done').length;
  const progress = tasks.filter(t => t.status === 'in_progress').length;
  document.getElementById('board-stats').innerHTML = `
    <span>共 <b>${total}</b> 项</span>
    <span>进行中 <b>${progress}</b></span>
    <span>已完成 <b>${done}</b></span>
  `;
}

// ===== 渲染：看板 =====
function renderBoard() {
  const container = document.getElementById('board-columns');
  const statuses = ['todo', 'in_progress', 'done', 'blocked'];

  container.innerHTML = statuses.map(status => {
    const cfg = STATUS_CONFIG[status];
    const tasks = boardData.tasks.filter(t => t.status === status);
    return `
      <div class="board-col ${cfg.colClass}">
        <div class="col-header">
          <span>${cfg.label}</span>
          <span class="count">${tasks.length}</span>
        </div>
        <div class="col-body">
          ${tasks.map(t => renderTaskCard(t, cfg)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderTaskCard(task, cfg) {
  const agent = boardData.agents.find(a => a.id === task.assignee);
  const agentColor = AGENT_COLORS[task.assignee] || '#8e8e93';
  const agentName = agent ? agent.name : task.assignee;
  const depends = task.depends_on && task.depends_on.length > 0
    ? `依赖: ${task.depends_on.join(', ')}` : '';

  return `
    <div class="task-card ${selectedTaskId === task.id ? 'selected' : ''}"
         onclick="openTaskDetail('${task.id}')">
      <div class="task-top">
        <span class="task-id">${task.id}</span>
        <span class="task-priority priority-${task.priority || 'low'}">${task.priority || 'low'}</span>
      </div>
      <div class="task-title">${task.title}</div>
      <div class="task-meta">
        <span class="task-assignee">
          <span class="dot" style="background:${agentColor};"></span>
          ${agentName}
        </span>
        ${depends ? `<span class="task-depends">${depends}</span>` : ''}
      </div>
      <div class="task-progress-bar">
        <div class="task-progress-fill ${cfg.progressClass}" style="width:${task.progress || 0}%;"></div>
      </div>
      ${task.artifact ? `<div class="task-artifact">${task.artifact}</div>` : ''}
    </div>
  `;
}

// ===== 任务详情 =====
function openTaskDetail(taskId) {
  selectedTaskId = taskId;
  const task = boardData.tasks.find(t => t.id === taskId);
  if (!task) return;

  const agent = boardData.agents.find(a => a.id === task.assignee);
  document.getElementById('detail-title').textContent = task.title;
  document.getElementById('detail-id').textContent = `${task.id} · ${(task.priority || 'low').toUpperCase()} 优先级`;

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-row"><span class="detail-label">负责人</span><span class="detail-value">${agent ? agent.name : task.assignee}</span></div>
    <div class="detail-row"><span class="detail-label">状态</span><span class="detail-value">${STATUS_CONFIG[task.status]?.label || task.status}</span></div>
    <div class="detail-row"><span class="detail-label">进度</span><span class="detail-value">${task.progress || 0}%</span></div>
    <div class="detail-row"><span class="detail-label">依赖</span><span class="detail-value">${task.depends_on?.join(', ') || '无'}</span></div>
    <div class="detail-row"><span class="detail-label">产物</span><span class="detail-value" style="color:var(--dim);">${task.artifact || '待产出'}</span></div>
    <div class="detail-row"><span class="detail-label">备注</span><span class="detail-value">${task.note || '—'}</span></div>
    <div class="detail-row"><span class="detail-label">更新时间</span><span class="detail-value">${task.updated ? task.updated.replace('T', ' ').replace('+08:00', '') : '—'}</span></div>
  `;

  document.getElementById('detail-actions').innerHTML = `
    <span class="actions-label">切换状态</span>
    ${Object.entries(STATUS_CONFIG).map(([key, cfg]) => `
      <button class="status-btn ${task.status === key ? 'active' : ''}"
              onclick="updateTaskStatus('${task.id}', '${key}')">${cfg.label}</button>
    `).join('')}
  `;

  document.getElementById('overlay').classList.add('show');
  document.getElementById('task-detail').classList.add('show');
  renderBoard();
}

function closeTaskDetail() {
  selectedTaskId = null;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('task-detail').classList.remove('show');
  renderBoard();
}

async function updateTaskStatus(taskId, status) {
  const progress = status === 'done' ? 100 : (status === 'in_progress' ? 50 : (status === 'todo' ? 0 : 10));
  try {
    await fetch(`/api/tasks/${taskId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, progress })
    });
    await loadBoard();
    openTaskDetail(taskId);
  } catch (e) {
    console.error('更新任务失败:', e);
  }
}

// ===== 渲染：聊天 =====
function renderChat() {
  const container = document.getElementById('chat-messages');
  const messages = boardData.messages;
  document.getElementById('msg-count').textContent = `${messages.length} 条`;

  if (messages.length === lastMessageCount && container.children.length > 0) return;
  lastMessageCount = messages.length;

  container.innerHTML = messages.map(m => renderMessage(m)).join('');

  if (autoScroll) {
    container.scrollTop = container.scrollHeight;
  }
}

function renderMessage(msg) {
  const agent = boardData.agents.find(a => a.id === msg.sender);
  const color = AGENT_COLORS[msg.sender] || '#8e8e93';
  const name = agent ? agent.name : msg.sender;
  const isSelf = msg.sender === currentIdentity;
  const isSystem = msg.type === 'system';

  const time = msg.timestamp ? msg.timestamp.split('T')[1].replace('+08:00', '') : '';

  if (isSystem) {
    return `<div class="msg system"><div class="msg-content">${msg.content}</div></div>`;
  }

  return `
    <div class="msg ${isSelf ? 'self' : ''}">
      <div class="msg-sender">
        <span class="dot" style="background:${color};"></span>
        <span style="color:${color};">${name}</span>
      </div>
      <div class="msg-content">${msg.content}</div>
      <div class="msg-time">${time}</div>
    </div>
  `;
}

// ===== 发送消息 =====
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const content = input.value.trim();
  if (!content) return;

  try {
    await fetch('/api/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sender: currentIdentity, content })
    });
    input.value = '';
    autoScroll = true;
    await loadBoard();
  } catch (e) {
    console.error('发送消息失败:', e);
  }
}

// ===== 事件监听 =====
function setupEventListeners() {
  const input = document.getElementById('chat-input');
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  const chatContainer = document.getElementById('chat-messages');
  chatContainer.addEventListener('scroll', () => {
    autoScroll = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 50;
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeTaskDetail();
  });
}

// ===== 启动 =====
init();
</script>
</body>
</html>
